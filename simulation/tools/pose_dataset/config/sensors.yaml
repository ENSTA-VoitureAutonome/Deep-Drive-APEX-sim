# Sensor profiles of the multi-scenario pose dataset.
#
# Every profile is synthesized from the exact 1 kHz simulator state of a
# trajectory (see README.md, "Sensor synthesis"). All random draws come from
# a seed derived from (run seed, sensor profile), so each run is reproducible.
#
# LiDAR (2D spinning scanner)
#   rate_hz, rate_jitter_rel   revolution rate and per-revolution std (motor speed)
#   beams, fov_deg, angle_min_deg
#   range_min_m, range_max_m
#   rolling_scan               true: beams are fired sequentially during the
#                              revolution with the pose at their own instant
#                              (motion distortion, as in a real scanner)
#   timestamp.offset_ms        constant stamp latency (reported - true)
#   timestamp.jitter_std_ms    stamp jitter std
#   scan_dropout_prob          probability that a whole scan is lost
#   noise                      apex_fusion_research LidarNoiseConfig fields:
#       range_sigma_const_m    distance noise std (constant part)
#       range_sigma_prop       distance-dependent noise (fraction of range)
#       incidence_sigma_gain   growth with the incidence angle
#       range_bias_std_m, range_scale_std   calibration errors per power-up
#       angle_jitter_std_rad   encoder jitter
#       dropout_prob_base      probability of a missing return (+ range and
#       dropout_prob_range_coeff, dropout_prob_grazing   grazing-angle terms)
#       short_prob, random_prob   outlier probabilities (close / uniform)
#       range_resolution_m     quantization
# IMU (6-axis MEMS)
#   rate_hz, clock_ppm_std     output data rate and sample-clock error; the
#                              period must be a whole number of 1 ms physics
#                              steps (50, 100, 125, 200, 250, 500, 1000 Hz)
#   dlpf_hz                    on-chip anti-alias low-pass (2nd order)
#   timestamp.offset_ms / jitter_std_ms
#   dropout_prob               isolated missing samples
#   dropout_burst_prob, dropout_burst_len   bus hiccups (consecutive samples)
#   vibration_gain             mount transmissibility of the chassis vibration
#   error                      apex_fusion_research ImuErrorConfig (white noise
#                              density, turn-on bias std, Gauss-Markov bias
#                              instability, bias random walk, scale factor,
#                              axis misalignment, g-sensitivity, full-scale
#                              saturation, ADC bits) for gyro and accel
#   initial_bias               per-axis bias added to the drawn turn-on bias
#                              (gyro rad/s, accel m/s^2)
# Extrinsics (both sensors)
#   extrinsic.xyz, extrinsic.rpy_deg        nominal mount in base_link
#   extrinsic_error.xyz_std_m, rpy_std_deg  true mount = nominal + error, drawn
#                                           per run (miscalibration)
#
# Gazebo-native profiles (`backend: gazebo_native`, used by dataset v2 and the
# live Gazebo simulation). The measurement comes from Gazebo's own sensors
# (gpu_lidar, imu) mounted on the car with suspension; the realism layer
# (apex_fusion_research core: lidar_rolling, imu_chip) turns it into what the
# real device outputs. Extra fields:
#   lidar.sample_rate_hz         device samples per second (A2M8: 2000 in the
#                                compatible protocol, 8000 in Sensitivity mode)
#   lidar.scan_direction         cw | ccw (physical rotation seen in base_link)
#   lidar.scan_start_angle_deg   base_link angle of the first sample of a
#                                revolution (device 0 deg, sync pulse)
#   lidar.binning                min_range: 1-degree bins keep the closest
#                                sample, like the APEX driver
#   lidar.occluded_sectors_deg   base_link sectors blocked by the car itself
#   lidar.publish_latency_ms     message available this long after the last
#                                sample of the revolution
#   lidar.gazebo                 gpu_lidar capture used as the geometry source
#   imu.gazebo_noise             noise that Gazebo applies natively on the
#                                1 kHz IMU (white density per axis, turn-on
#                                bias, Gauss-Markov bias); the remaining terms
#                                of `error` (scale, misalignment,
#                                g-sensitivity, quantization, saturation) and
#                                the chip low-pass are applied by imu_chip
#   imu.dlpf                     chip filter (gyro / accel cut-off) before the
#                                output data rate; rate_hz need not be a whole
#                                number of physics steps (exact sample times)
#   imu.publish_latency_ms       message available this long after sampling
#
# Profiles with `held_out: true` are zero-shot variants (ZERO_SHOT.md).

profiles:
  A_nominal:
    description: Commercial RPLIDAR-class scanner at 12 Hz and an MPU-6050-class IMU at 125 Hz.
    lidar:
      rate_hz: 12.0
      rate_jitter_rel: 0.01
      beams: 360
      fov_deg: 360.0
      angle_min_deg: -180.0
      range_min_m: 0.15
      range_max_m: 12.0
      rolling_scan: true
      timestamp: {offset_ms: 0.0, jitter_std_ms: 0.5}
      scan_dropout_prob: 0.002
      noise:
        range_sigma_const_m: 0.003
        range_sigma_prop: 0.005
        incidence_sigma_gain: 0.5
        range_bias_std_m: 0.005
        range_scale_std: 0.002
        angle_jitter_std_rad: 0.0035
        dropout_prob_base: 0.005
        dropout_prob_range_coeff: 0.05
        grazing_angle_deg: 75.0
        dropout_prob_grazing: 0.3
        short_prob: 0.002
        short_rate_per_m: 1.0
        random_prob: 0.001
        range_resolution_m: 0.00025
      extrinsic: {xyz: [0.18, 0.0, 0.12], rpy_deg: [0.0, 0.0, 0.0]}
      extrinsic_error: {xyz_std_m: 0.003, rpy_std_deg: 0.3}
    imu:
      rate_hz: 125.0
      clock_ppm_std: 30.0
      dlpf_hz: 44.0
      timestamp: {offset_ms: 0.0, jitter_std_ms: 0.1}
      dropout_prob: 0.001
      dropout_burst_prob: 0.0002
      dropout_burst_len: [2, 6]
      vibration_gain: 1.0
      error:
        gyro: {noise_density: 8.727e-5, turn_on_bias_std: 8.727e-3, bias_instability_std: 8.727e-5, bias_correlation_time_s: 100.0, bias_random_walk: 1.0e-6, scale_factor_std: 0.01, misalignment_std_rad: 0.007, g_sensitivity_std: 1.0e-4, full_scale: 8.727, adc_bits: 16}
        accel: {noise_density: 3.923e-3, turn_on_bias_std: 0.05, bias_instability_std: 5.0e-4, bias_correlation_time_s: 100.0, bias_random_walk: 1.0e-4, scale_factor_std: 0.01, misalignment_std_rad: 0.007, full_scale: 39.227, adc_bits: 16}
      initial_bias: {gyro_rps: [0.0, 0.0, 0.0], accel_mps2: [0.0, 0.0, 0.0]}
      extrinsic: {xyz: [0.02, 0.0, 0.08], rpy_deg: [0.0, 0.0, 0.0]}
      extrinsic_error: {xyz_std_m: 0.002, rpy_std_deg: 0.5}

  B_economic:
    description: >-
      Low-cost 10 Hz scanner with 8 m range, noisier ranges, more dropouts and
      outliers, and a 100 Hz IMU with large biases, 12-bit ADC, +-250 deg/s and
      +-2 g ranges (saturates in hard braking), hard mount (more vibration).
    lidar:
      rate_hz: 10.0
      rate_jitter_rel: 0.02
      beams: 360
      fov_deg: 360.0
      angle_min_deg: -180.0
      range_min_m: 0.15
      range_max_m: 8.0
      rolling_scan: true
      timestamp: {offset_ms: 2.0, jitter_std_ms: 2.0}
      scan_dropout_prob: 0.01
      noise:
        range_sigma_const_m: 0.008
        range_sigma_prop: 0.012
        incidence_sigma_gain: 0.8
        range_bias_std_m: 0.015
        range_scale_std: 0.005
        angle_jitter_std_rad: 0.007
        dropout_prob_base: 0.03
        dropout_prob_range_coeff: 0.15
        grazing_angle_deg: 70.0
        dropout_prob_grazing: 0.5
        short_prob: 0.01
        short_rate_per_m: 1.0
        random_prob: 0.006
        range_resolution_m: 0.001
      extrinsic: {xyz: [0.16, 0.0, 0.14], rpy_deg: [0.0, 0.0, 0.0]}
      extrinsic_error: {xyz_std_m: 0.006, rpy_std_deg: 0.8}
    imu:
      rate_hz: 100.0
      clock_ppm_std: 100.0
      dlpf_hz: 20.0
      timestamp: {offset_ms: 1.0, jitter_std_ms: 1.0}
      dropout_prob: 0.01
      dropout_burst_prob: 0.002
      dropout_burst_len: [2, 10]
      vibration_gain: 1.6
      error:
        gyro: {noise_density: 2.2e-4, turn_on_bias_std: 2.6e-2, bias_instability_std: 3.0e-4, bias_correlation_time_s: 60.0, bias_random_walk: 5.0e-6, scale_factor_std: 0.02, misalignment_std_rad: 0.015, g_sensitivity_std: 3.0e-4, full_scale: 4.363, adc_bits: 12}
        accel: {noise_density: 1.0e-2, turn_on_bias_std: 0.15, bias_instability_std: 2.0e-3, bias_correlation_time_s: 60.0, bias_random_walk: 4.0e-4, scale_factor_std: 0.02, misalignment_std_rad: 0.015, full_scale: 19.613, adc_bits: 12}
      initial_bias: {gyro_rps: [0.0, 0.0, 0.005], accel_mps2: [0.05, -0.03, 0.0]}
      extrinsic: {xyz: [-0.05, 0.03, 0.07], rpy_deg: [0.0, 0.0, 0.0]}
      extrinsic_error: {xyz_std_m: 0.004, rpy_std_deg: 1.0}

  C_fast:
    description: >-
      Fast 20 Hz scanner with 16 m range and low noise, and a 200 Hz
      ICM-42688-class IMU with small (non-zero) noise and biases.
    lidar:
      rate_hz: 20.0
      rate_jitter_rel: 0.005
      beams: 360
      fov_deg: 360.0
      angle_min_deg: -180.0
      range_min_m: 0.10
      range_max_m: 16.0
      rolling_scan: true
      timestamp: {offset_ms: 0.0, jitter_std_ms: 0.2}
      scan_dropout_prob: 0.001
      noise:
        range_sigma_const_m: 0.002
        range_sigma_prop: 0.003
        incidence_sigma_gain: 0.4
        range_bias_std_m: 0.003
        range_scale_std: 0.001
        angle_jitter_std_rad: 0.0017
        dropout_prob_base: 0.002
        dropout_prob_range_coeff: 0.03
        grazing_angle_deg: 78.0
        dropout_prob_grazing: 0.2
        short_prob: 0.001
        short_rate_per_m: 1.0
        random_prob: 0.0005
        range_resolution_m: 0.00025
      extrinsic: {xyz: [0.12, 0.0, 0.15], rpy_deg: [0.0, 0.0, 0.0]}
      extrinsic_error: {xyz_std_m: 0.002, rpy_std_deg: 0.2}
    imu:
      rate_hz: 200.0
      clock_ppm_std: 20.0
      dlpf_hz: 98.0
      timestamp: {offset_ms: 0.0, jitter_std_ms: 0.05}
      dropout_prob: 0.0005
      dropout_burst_prob: 0.0001
      dropout_burst_len: [2, 4]
      vibration_gain: 0.8
      error:
        gyro: {noise_density: 4.9e-5, turn_on_bias_std: 3.5e-3, bias_instability_std: 4.0e-5, bias_correlation_time_s: 150.0, bias_random_walk: 5.0e-7, scale_factor_std: 0.005, misalignment_std_rad: 0.004, g_sensitivity_std: 5.0e-5, full_scale: 34.907, adc_bits: 16}
        accel: {noise_density: 6.9e-4, turn_on_bias_std: 0.02, bias_instability_std: 2.0e-4, bias_correlation_time_s: 150.0, bias_random_walk: 4.0e-5, scale_factor_std: 0.005, misalignment_std_rad: 0.004, full_scale: 156.9, adc_bits: 16}
      initial_bias: {gyro_rps: [0.0, 0.0, 0.0], accel_mps2: [0.0, 0.0, 0.0]}
      extrinsic: {xyz: [0.0, 0.0, 0.09], rpy_deg: [0.0, 0.0, 0.0]}
      extrinsic_error: {xyz_std_m: 0.001, rpy_std_deg: 0.2}

  # ------------------------------------------------------------- zero-shot

  # Real APEX hardware at its correct timing (real2sim). Provenance:
  #   [ds-a2m8]   SLAMTEC RPLIDAR A2M8 datasheet (0.15-12 m, 5-15 Hz, 2000 /
  #               4000-8000 samples/s, clockwise rotation, <1 % of range)
  #   [ds-lsm]    ST LSM6DS3 datasheet DocID026899 Rev 10, Table 3 / Table 48
  #   [code]      real_vehicle: Arduino_LSM6DS3 defaults (104 Hz, +-4 g,
  #               +-2000 dps), rplidar_publisher_node._build_slam_ranges
  #               (heading_offset_deg 91, theta = 180 - (a + 91), closest
  #               sample per 1-degree bin), base_to_laser TF (0.18, 0, 0.12)
  #   [real-id]   tools/analysis/real_sensor_identification.py on
  #               real_vehicle/data (22 LiDAR and 2 IMU recordings)
  #   [assump]    assumption, see README
  #   [robust]    widened for robustness (v3): datasheet bounds instead of the
  #               two real IMU recordings, per power-up stamp offsets, host
  #               reception jitter and occasional USB / serial losses
  # Timing defects of the current car software (IMU at 55.6 Hz, stamps on
  # reception, 2 kHz compatible protocol) are NOT modelled; they are listed in
  # real_vehicle/docs/sensor_timing_requirements.md. The training of the v3
  # hybrid also sees IMU rates of 52 Hz (learning/lidar_imu_pose/config/robust_real.yaml).
  APEX_real:
    backend: gazebo_native
    hardware: APEX                   # physical sensor set; runs of one trajectory with the same hardware share it
    description: APEX car hardware - RPLIDAR A2M8 in Express scan (4 kHz) at 10 Hz and LSM6DS3 at 104 Hz, correct timing.
    lidar:
      model: RPLIDAR A2M8
      # Design target: 10 Hz (600 rpm), the A2M8 typical rate [ds-a2m8] and the
      # motor speed rplidar_ros sets for the A series; with the Express scan that
      # is 400 samples per revolution, one or more per 1-degree bin (at 13 Hz only
      # ~307: the reactive driver and SLAM lost walls). Today's python driver
      # turns at 13.03 Hz [real-id]: APEX_real_express13 / APEX_real_compat.
      rate_hz: 10.0
      rate_jitter_rel: 0.01          # [assump] open-loop motor PWM
      # Design target: Express scan, 4000 samples/s, which every A2M8 supports
      # (datasheet v1.0 2017: 4000 typical with the high-speed protocol; SDK
      # express scan from firmware 1.17). 8000 (Sensitivity) needs firmware
      # >= 1.24 and is not assumed: APEX_real_sensitivity. 2000 = compatible
      # protocol of today's python driver: APEX_real_compat.
      sample_rate_hz: 4000.0         # [ds-a2m8]
      scan_direction: cw             # [ds-a2m8] + [code]
      scan_start_angle_deg: 89.0     # [code] device 0 deg -> 180 - (0 + 91)
      binning: min_range             # [code]
      occluded_sectors_deg: [[145.0, 205.0]]  # [real-id] no return behind the car in 21/21 recordings
      beams: 360
      fov_deg: 360.0
      angle_min_deg: -180.0
      range_min_m: 0.15              # [ds-a2m8]
      range_max_m: 12.0              # [ds-a2m8] + [code]
      rolling_scan: true
      timestamp: {offset_ms: 0.0, offset_std_ms: 3.0, jitter_std_ms: 1.0}   # stamp = first sample of the revolution; [robust] offset per power-up, host jitter
      publish_latency_ms: 3.0        # [assump] serial transfer of the last packet
      scan_dropout_prob: 0.01        # [robust] lost revolution (serial hiccup)
      gazebo: {capture_rate_hz: 26.0, capture_samples: 1440, capture_range_min_m: 0.05}
      noise:
        # [real-id] static bins, after removing the range spread across each
        # 1-degree bin (the binning of this model reproduces it): 0.75 mm +
        # 0.23 % r (median over recordings) to 3.0 mm + 0.35 % r (pooled
        # bins), median 1.3 mm; rounded up. Datasheet bound: 1 % of range.
        range_sigma_const_m: 0.001
        range_sigma_prop: 0.003
        incidence_sigma_gain: 0.5
        range_bias_std_m: 0.005
        range_scale_std: 0.002
        angle_jitter_std_rad: 0.0035
        dropout_prob_base: 0.12      # [real-id] as measured in the standard (2 kHz) mode: 0.37 hit fraction per bin vs 0.43 geometric; the Express scan has no extra sensitivity
        dropout_prob_range_coeff: 0.1
        grazing_angle_deg: 75.0
        dropout_prob_grazing: 0.3
        short_prob: 0.002
        short_rate_per_m: 1.0
        random_prob: 0.001
        range_resolution_m: 0.00025  # [ds-a2m8] quarter-millimetre output unit
      extrinsic: {xyz: [0.18, 0.0, 0.12], rpy_deg: [0.0, 0.0, 0.0]}   # [code]
      extrinsic_error: {xyz_std_m: 0.003, rpy_std_deg: 0.7}           # [assump] hand-tuned heading offset
    imu:
      model: LSM6DS3 (Arduino Nano 33 IoT)
      rate_hz: 104.0                 # [ds-lsm] + [code] ODR
      clock_ppm_std: 5000.0          # [assump] internal oscillator
      dlpf: {gyro_hz: 33.0, accel_hz: 50.0}   # accel [ds-lsm] Table 48; gyro [assump] LPF1 at 104 Hz
      timestamp: {offset_ms: 0.0, offset_std_ms: 3.0, jitter_std_ms: 0.5}   # stamp = sampling instant (data-ready); [robust] offset per power-up, host jitter
      publish_latency_ms: 2.0        # [assump] USB CDC line
      dropout_prob: 0.005            # [robust] isolated USB CDC losses
      dropout_burst_prob: 0.001      # [robust] bus hiccups
      dropout_burst_len: [2, 4]
      vibration_gain: 1.0
      gazebo_noise:
        # Installed noise [real-id] (rest std at the output) converted to a
        # white density through the chip filter bandwidth; above the datasheet
        # floor (7 mdps/rtHz, 90 ug/rtHz) because the car adds electrical and
        # servo noise.
        # Turn-on bias [robust]: zero-rate level +-10 dps [ds-lsm] taken as 2.5 sigma
        # (0.07 rad/s); y raised to cover the real 0.103 rad/s [real-id].
        gyro: {noise_density: [3.1e-4, 6.4e-4, 2.8e-4], turn_on_bias_std: [0.07, 0.10, 0.07], bias_instability_std: 5.0e-4, bias_correlation_time_s: 200.0}
        accel: {noise_density: [1.0e-2, 1.4e-2, 1.3e-2], turn_on_bias_std: [0.3, 0.3, 0.3], bias_instability_std: 5.0e-3, bias_correlation_time_s: 200.0}
      error:
        # Terms applied by imu_chip (Gazebo has no equivalent).
        gyro: {scale_factor_std: 0.01, misalignment_std_rad: 0.01, g_sensitivity_std: 1.0e-4, full_scale: 34.907, adc_bits: 16}
        accel: {scale_factor_std: 0.01, misalignment_std_rad: 0.01, full_scale: 39.227, adc_bits: 16}
      # Warm-up drift [ds-lsm]: zero-rate change 0.05 dps/degC, zero-g change
      # 0.5 mg/degC (typical values taken as 1 sigma per axis); board rise and
      # time constant [assump] (Nano 33 IoT next to the motor driver).
      thermal: {gyro_coeff_std: 8.727e-4, accel_coeff_std: 4.903e-3, rise_c: [10.0, 25.0], tau_s: [300.0, 900.0], start_frac: [0.0, 1.0]}
      extrinsic: {xyz: [0.02, 0.0, 0.08], rpy_deg: [0.0, 0.0, 0.0]}   # URDF mount of the real car
      extrinsic_error: {xyz_std_m: 0.003, rpy_std_deg: 2.0}           # [real-id] 3.1 deg apparent tilt at rest (bias + mount) [robust]

  APEX_real_compat:
    backend: gazebo_native
    description: Same hardware with the A2M8 in the 2 kHz compatible protocol (sparse 1-degree bins), as the python rplidar driver runs it today.
    inherit: APEX_real
    lidar:
      rate_hz: 13.03                 # [real-id] today's python driver
      sample_rate_hz: 2000.0         # [ds-a2m8] compatible protocol

  APEX_real_wt61:
    backend: gazebo_native
    description: The car as it is wired today - A2M8 Express 4 kHz at 10 Hz, and the DFRobot WT61PC at 100 Hz over the Nano UART bridge instead of the LSM6DS3.
    inherit: APEX_real
    # The IMU of the car changed (arduino/wt61pc_uart_stream, measured on the
    # car 2026-10-09) and nothing downstream knew: `live_odometry` shifts every
    # IMU stamp back by the chip's group delay, sqrt(2)/(2*pi*f_dlpf), which is
    # 6.82 ms for the LSM6DS3's 33 Hz gyro filter and 5.36 ms for this one. A
    # 1.46 ms systematic stamp error is of the order of the per-revolution yaw
    # noise, i.e. exactly the kind of bias the identified `trim` would silently
    # absorb. The rate matters too: `_Health` only warns above 10 %, so 100 vs
    # 104 Hz would never have been reported.
    #
    # This profile is for *inference on the car* and for the timing audit. The
    # Gazebo noise model is inherited from the LSM6DS3 and has not been
    # re-identified for this chip, so it is not a training profile.
    imu:
      model: DFRobot WT61PC (SEN0386) over the Nano 33 IoT UART bridge
      rate_hz: 100.0                 # [real-id] sketch v2, measured on the car
      dlpf: {gyro_hz: 42.0, accel_hz: 42.0}   # [real-id] module bandwidth setting
      # [real-id] at rest the module reports exactly 0.000 rad/s on every axis:
      # it recalibrates its zero-rate level and the reading carries no noise at
      # all. Measured on the car 2026-10-11, and the reason the standstill
      # supplement of the dataset is generated with APEX_real_az.
      gyro_autozero: {speed_mps: 0.01, rate_rps: 0.02, hold_s: 0.5}

  APEX_real_az:
    backend: gazebo_native
    description: APEX_real with the WT61PC's zero-rate recalibration at rest - the training profile of the standstill supplement.
    inherit: APEX_real
    # Identical to APEX_real in every other respect, on purpose: it is the one
    # variable of the standstill experiment. The LSM6DS3 noise model, the LiDAR
    # and the filter delays are the parent's, so a run under this profile and a
    # run under APEX_real differ only in what the gyro reports while parked, and
    # the training stream holds both static signatures.
    imu:
      gyro_autozero: {speed_mps: 0.01, rate_rps: 0.02, hold_s: 0.5}

  APEX_real_express13:
    backend: gazebo_native
    description: Same hardware with the A2M8 in Express scan (4 kHz) at 13.03 Hz, the APEX_real of dataset v3 and of the v4 hybrid.
    inherit: APEX_real
    lidar:
      rate_hz: 13.03                 # [real-id]

  APEX_real_lowdrop_diag:
    backend: gazebo_native
    description: DIAGNOSTIC ONLY - APEX_real (Express 4 kHz, 10 Hz) with the 3 % missing-return rate of the Sensitivity mode, to isolate the effect of dropouts on the reactive driver.
    inherit: APEX_real
    lidar:
      noise:
        dropout_prob_base: 0.03

  APEX_real_sensitivity:
    backend: gazebo_native
    description: Same hardware with the A2M8 in Sensitivity mode (8 kHz, firmware >= 1.24), the design target of dataset v2 and of the v2 / v3-robust models.
    inherit: APEX_real
    lidar:
      rate_hz: 13.03                 # [real-id]
      sample_rate_hz: 8000.0         # [ds-a2m8] Sensitivity mode
      noise:
        dropout_prob_base: 0.03      # [assump] Sensitivity mode keeps dark surfaces

  ZS_D_dense_270:
    held_out: true
    description: >-
      ZERO-SHOT: 15 Hz scanner with 720 beams over a 270 deg field of view
      (rear blind sector), 25 m range, and a 500 Hz IMU mounted rotated 90 deg
      in yaw (sensor x axis pointing to the left of the car).
    lidar:
      rate_hz: 15.0
      rate_jitter_rel: 0.01
      beams: 720
      fov_deg: 270.0
      angle_min_deg: -135.0
      range_min_m: 0.10
      range_max_m: 25.0
      rolling_scan: true
